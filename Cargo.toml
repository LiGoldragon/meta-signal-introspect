[package]
name         = "meta-signal-introspect"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/meta-signal-introspect"
description  = "Meta signal contract for privileged introspect daemon configuration."
publish      = false

[lib]
name = "meta_signal_introspect"
path = "src/lib.rs"

[features]
default = ["dotos-text"]
dotos-text = ["signal-frame/dotos-text"]

[dependencies]
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main" }
signal-introspect    = { git = "https://github.com/LiGoldragon/signal-introspect.git", branch = "main" }
dotos    = { git = "https://github.com/LiGoldragon/dotos.git", rev = "1facca44fbcb" }
rkyv         = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror    = "2"

[dev-dependencies]
signal-persona = { git = "https://github.com/LiGoldragon/signal-persona.git", branch = "main" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
